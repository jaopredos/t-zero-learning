# PPO assignment config — LunarLander
#
# Every key maps onto a dataclass field (unknown keys fail at startup):
#   run-level keys -> core/base_config.py::RunConfig (incl. network,
#                     network_kwargs: the network class and its constructor args)
#   ppo:           -> algorithms/ppo.py::PPOConfig
# Keys left out keep the dataclass defaults.
#


algorithm: ppo
env_id: LunarLander-v3
seed: 1
cuda: false             # CPU is plenty for this env
total_timesteps: 2000000 # teto permitido pela Parte 4
num_envs: 16             # parallel environments -> batch = num_envs * num_steps

track: true             # log metrics to Weights & Biases (set WANDB_PROJECT in .env)
capture_video: true     # record a video during the final evaluation
save_model: true        # write model.pt + run a final evaluation
checkpoint_every: 0

network: DiscreteActorCritic   # your network from the A2C assignment
network_kwargs:                # passed to its constructor — see its signature
  activation: Tanh
  hidden_layers_size: 128

ppo:
  learning_rate: 2.5e-4
  anneal_lr: true
  num_steps: 128        # rollout length per env
  gamma: 0.99
  gae_lambda: 0.9
  num_minibatches: 4    # minibatch = batch / num_minibatches
  update_epochs: 2      # passes over each rollout
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.015
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
